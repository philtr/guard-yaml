name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master

permissions:
  contents: read

jobs:
  release_check:
    name: Check release version
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Check for version tag
        id: version
        shell: bash
        env:
          TESTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          release_tag="v$(ruby -Ilib -rguard/yaml/version -e 'print Guard::YamlVersion::VERSION')"
          master_commit="$(git ls-remote origin refs/heads/master | cut -f1)"

          if [[ "${master_commit}" != "${TESTED_COMMIT}" ]]; then
            echo "A newer master commit is waiting for CI."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
          elif git rev-parse --verify --quiet "refs/tags/${release_tag}"; then
            echo "${release_tag} has already been released."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "${release_tag} is ready to release."
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          fi

  release:
    name: Tag and release to RubyGems.org
    if: >-
      github.repository == 'philtr/guard-yaml' &&
      needs.release_check.outputs.should_release == 'true'
    needs: release_check
    concurrency: rubygems-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out master branch
        env:
          TESTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: git switch --force-create master "${TESTED_COMMIT}"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Create tag and publish gem
        uses: rubygems/release-gem@v1
