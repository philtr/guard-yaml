name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.1"
          - "4.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake

      - name: Build gem
        run: bundle exec rake build

  lint:
    name: StandardRB
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Run StandardRB
        run: bundle exec standardrb

  release_check:
    name: Check release version
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      - name: Check for version tag
        id: version
        shell: bash
        run: |
          release_tag="v$(ruby -Ilib -rguard/yaml/version -e 'print Guard::YamlVersion::VERSION')"
          if git rev-parse --verify --quiet "refs/tags/${release_tag}"; then
            echo "${release_tag} has already been released."
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
          else
            echo "${release_tag} is ready to release."
            echo "should_release=true" >> "${GITHUB_OUTPUT}"
          fi

  release:
    name: Tag and release to RubyGems.org
    if: needs.release_check.outputs.should_release == 'true'
    needs: release_check
    concurrency: rubygems-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Create tag and publish gem
        uses: rubygems/release-gem@v1
